name: CI

on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  build-test:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Advisory: surfaces lint issues without blocking merges on legacy debt.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # Hard gates below — these must pass.
      - name: Unit tests
        run: npm test

      - name: Build
        env:
          # Public build-time vars (safe placeholders for CI build only)
          VITE_SHOPIFY_STORE_DOMAIN: example.myshopify.com
          VITE_SHOPIFY_STOREFRONT_TOKEN: ci-placeholder
        run: npm run build
